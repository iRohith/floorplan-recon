[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "floorplan-recon"
version = "0.1.0"
description = "Three-tier handheld capture to measured floor plans"
requires-python = ">=3.11"
dependencies = ["numpy", "scipy", "opencv-python", "matplotlib", "shapely", "pillow"]

[project.scripts]
floorplan = "floorplan.cli:main"

[tool.setuptools.packages.find]
include = ["floorplan*"]
